<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de Persona — Memoria Sefardí</title>
  <meta name="description" content="Ficha biográfica, registros documentales y relaciones genealógicas de personajes de la historia sefardí.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'serif'],
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            sefarad: {
              50: '#fbf8f2', 100: '#f4ede0', 200: '#e7d8be', 300: '#d7bf97',
              400: '#c5a16d', 500: '#b28549', 600: '#9b6e3c', 700: '#7e5433',
              800: '#67442f', 900: '#54392a', 950: '#2e1c15',
            },
            royal: { 800: '#1e293b', 900: '#0f172a', 950: '#080d1a' }
          }
        }
      }
    }
  </script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-sefarad-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="sticky top-0 z-50 bg-royal-950/90 backdrop-blur-md border-b border-sefarad-500/20 text-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        <a href="../index.html" class="flex items-center gap-3 group">
          <div class="w-11 h-11 rounded-full bg-gradient-to-br from-sefarad-400 to-sefarad-700 flex items-center justify-center shadow-lg shadow-sefarad-600/30">
            <span class="font-serif text-2xl font-bold text-white tracking-widest">מ</span>
          </div>
          <div class="flex flex-col">
            <span class="font-serif text-2xl font-bold tracking-wide text-sefarad-100">Memoria Sefardí</span>
            <span class="text-xs tracking-widest uppercase text-sefarad-400 font-medium">Enciclopedia Histórica</span>
          </div>
        </a>

        <!-- Buscador rápido en cabecera -->
        <div class="hidden lg:block flex-1 max-w-md mx-8">
          <form action="personas.html" method="get" class="relative">
            <input type="search" name="q" placeholder="Buscar personas, familias..." class="w-full bg-slate-900/80 text-sm text-slate-200 placeholder-slate-400 rounded-full pl-10 pr-4 py-2 border border-sefarad-500/30 focus:outline-none focus:border-sefarad-400">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-sefarad-400 text-sm"></i>
          </form>
        </div>

        <!-- Navegación -->
        <nav class="hidden lg:flex items-center space-x-1 text-sm font-medium">
          <a href="../index.html" class="px-3 py-1.5 rounded-md text-slate-300 hover:text-white transition-all">Inicio</a>
          <a href="personas.html" class="px-3 py-1.5 rounded-md bg-sefarad-600 text-white font-semibold">Personas</a>
          <a href="familias.html" class="px-3 py-1.5 rounded-md text-slate-300 hover:text-white transition-all">Familias</a>
          <a href="apellidos.html" class="px-3 py-1.5 rounded-md text-slate-300 hover:text-white transition-all">Apellidos</a>
          <a href="documentos.html" class="px-3 py-1.5 rounded-md text-slate-300 hover:text-white transition-all">Documentos</a>
          <a href="mapa.html" class="px-3 py-1.5 rounded-md text-slate-300 hover:text-white transition-all">Mapa</a>
          <a href="biblioteca.html" class="px-3 py-1.5 rounded-md text-slate-300 hover:text-white transition-all">Biblioteca</a>
          <a href="../admin.html" class="px-3 py-1.5 rounded-md text-sefarad-400 font-semibold"><i class="fa-solid fa-plus-circle mr-1"></i> Admin</a>
        </nav>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL DINÁMICO -->
  <main id="persona-detalle" class="flex-grow max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="bg-white p-10 rounded-2xl shadow-xl border border-sefarad-200 text-center">
      <i class="fa-solid fa-spinner fa-spin text-3xl text-sefarad-600 mb-3"></i>
      <h2 class="font-serif text-xl font-bold text-slate-800">Cargando expediente biográfico...</h2>
      <p class="text-xs text-slate-500 mt-1">Consultando registros históricos en la base de datos.</p>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-royal-950 text-slate-400 border-t border-sefarad-500/20 py-8 text-center text-sm mt-12">
    <div class="max-w-7xl mx-auto px-4">
      <p class="text-sefarad-300 font-serif text-base mb-1">Memoria Sefardí</p>
      <p>&copy; 2026 Memoria Sefardí. Todos los derechos reservados.</p>
    </div>
  </footer>

  <!-- SCRIPTS DE CONEXIÓN Y RENDERIZADO -->
  <script src="../js/supabase.js"></script>
  <script>
    // Base de datos de respaldo local por si no hay ID o conexión directa
    const personasDemo = [
      {
        id: "1",
        nombre: "Luis de Carvajal y de la Cueva",
        fechas: "c. 1539 – 1591",
        rol: "Gobernador del Nuevo Reino de León y Explorador",
        lugar: "Mogadouro, Portugal / Ciudad de México",
        evidencia: "Documentado",
        biografia: "Figura central en la historia del norte de la Nueva España. Gobernador y pacificador del Nuevo Reino de León. Proveniente de una familia criptojudia portuguesa, su linaje y el de sus familiares fueron procesados posteriormente por el Tribunal del Santo Oficio de la Inquisición.",
        padres: "Francisca de la Cueva y Gaspar de Carvajal",
        conyuge: "Guiomar de Ribera",
        fuentes: "Proceso inquisitorial de Luis de Carvajal (Archivo General de la Nación, México)."
      },
      {
        id: "2",
        nombre: "Doña Beatriz Enríquez",
        fechas: "c. 1556 – 1596",
        rol: "Matrona Criptojudía y Procesada por la Inquisición",
        lugar: "Benavente, España / Ciudad de México",
        evidencia: "Documentado",
        biografia: "Hermana de Luis de Carvajal el Mozo y figura matriarcal del grupo criptojudío descubierto en la Ciudad de México a finales del siglo XVI. Soportó procesos inquisitoriales junto con gran parte de su núcleo familiar.",
        padres: "Francisco Rodríguez y Francisca Núñez",
        conyuge: "Rodrigo de Juárez",
        vínculos: "Familia Carvajal",
        fuentes: "Libros de Memorias de Luis de Carvajal (El Mozo)."
      }
    ];

    function renderizarPersona(persona) {
      const container = document.getElementById('persona-detalle');
      
      let badgeClass = "bg-emerald-50 text-emerald-800 border-emerald-300";
      let dotColor = "bg-emerald-500";
      const ev = (persona.evidencia || persona.nivel_evidencia || "Documentado").toLowerCase();
      if (ev.includes('estimado') || ev.includes('probable')) {
        badgeClass = "bg-amber-50 text-amber-800 border-amber-300";
        dotColor = "bg-amber-500";
      } else if (ev.includes('hipótesis')) {
        badgeClass = "bg-rose-50 text-rose-800 border-rose-300";
        dotColor = "bg-rose-500";
      }

      container.innerHTML = `
        <!-- ENCABEZADO DE LA FICHA -->
        <div class="mb-6">
          <a href="personas.html" class="inline-flex items-center gap-2 text-xs font-semibold text-sefarad-700 hover:text-sefarad-900 mb-4 bg-sefarad-100 px-3 py-1.5 rounded-lg transition-colors">
            <i class="fa-solid fa-arrow-left"></i> Volver al listado de personas
          </a>
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-8 rounded-2xl shadow-xl border border-sefarad-200">
            <div>
              <div class="flex items-center gap-3 mb-2">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold border ${badgeClass}">
                  <span class="w-1.5 h-1.5 rounded-full ${dotColor}"></span>
                  ${persona.evidencia || persona.nivel_evidencia || 'Documentado'}
                </span>
                <span class="text-xs text-slate-500 font-medium"><i class="fa-solid fa-calendar-days mr-1 text-sefarad-500"></i> ${persona.fechas || persona.periodo || 'Siglo XVI'}</span>
              </div>
              <h1 class="font-serif text-3xl md:text-4xl font-bold text-slate-900">${persona.nombre || persona.titulo}</h1>
              <p class="text-sefarad-700 font-medium mt-1 text-base">${persona.rol || persona.ocupacion || 'Personalidad Histórica'}</p>
            </div>
            <div class="bg-sefarad-50 p-4 rounded-xl border border-sefarad-200 text-xs text-slate-600 flex flex-col gap-1.5 min-w-[220px]">
              <div><strong class="text-slate-800"><i class="fa-solid fa-location-dot text-sefarad-600 mr-1"></i> Origen/Lugar:</strong> ${persona.lugar || persona.origen || 'No especificado'}</div>
              <div><strong class="text-slate-800"><i class="fa-solid fa-users text-sefarad-600 mr-1"></i> Familia:</strong> ${persona.familia || persona.vinculos || 'Linaje Sefardí'}</div>
            </div>
          </div>
        </div>

        <!-- CUERPO DE BIOGRAFÍA Y DATOS -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
          
          <!-- COLUMNA PRINCIPAL DE BIOGRAFÍA -->
          <div class="lg:col-span-2 space-y-6">
            <div class="bg-white p-8 rounded-2xl shadow-xl border border-sefarad-200">
              <h3 class="font-serif text-2xl font-bold text-slate-900 mb-4 pb-2 border-b border-sefarad-100">Semblanza Biográfica</h3>
              <p class="text-slate-700 font-light leading-relaxed text-base whitespace-pre-line">
                ${persona.biografia || persona.descripcion || 'No se cuenta con una semblanza detallada registrada en este expediente.'}
              </p>
            </div>

            <div class="bg-white p-8 rounded-2xl shadow-xl border border-sefarad-200">
              <h3 class="font-serif text-2xl font-bold text-slate-900 mb-4 pb-2 border-b border-sefarad-100">Contexto Documental y Referencias</h3>
              <p class="text-sm text-slate-600 font-light leading-relaxed">
                <i class="fa-solid fa-scroll text-sefarad-600 mr-2"></i> ${persona.fuentes || persona.documentacion || 'Archivos históricos y registros inquisitoriales de la época.'}
              </p>
            </div>
          </div>

          <!-- COLUMNA LATERAL DE RELACIONES GENEALÓGICAS -->
          <div class="space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-xl border border-sefarad-200">
              <h3 class="font-serif text-xl font-bold text-slate-900 mb-4 pb-2 border-b border-sefarad-100">Conexiones Familiares</h3>
              <ul class="space-y-3 text-sm text-slate-700">
                <li class="flex items-start gap-2">
                  <i class="fa-solid fa-user-tie text-sefarad-600 mt-1"></i>
                  <div>
                    <strong class="block text-xs uppercase tracking-wider text-slate-400">Padres / Ascendencia</strong>
                    <span>${persona.padres || 'No registrado'}</span>
                  </div>
                </li>
                <li class="flex items-start gap-2">
                  <i class="fa-solid fa-ring text-sefarad-600 mt-1"></i>
                  <div>
                    <strong class="block text-xs uppercase tracking-wider text-slate-400">Cónyuge / Enlace</strong>
                    <span>${persona.conyuge || 'No registrado'}</span>
                  </div>
                </li>
              </ul>
            </div>

            <div class="bg-sefarad-100/70 p-6 rounded-2xl border border-sefarad-300 text-xs text-slate-700">
              <p><i class="fa-solid fa-circle-info text-sefarad-700 mr-1.5 font-bold"></i> Los datos genealógicos de este perfil están sujetos a revisión continua mediante actas notariales e inquisitoriales.</p>
            </div>
          </div>

        </div>
      `;
    }

    async function cargarDatosPersona() {
      const params = new URLSearchParams(window.location.search);
      const idParam = params.get('id') || params.get('slug') || "1";

      try {
        if (typeof _supabaseClient !== 'undefined') {
          // Intenta buscar el registro en Supabase por ID o slug
          const { data, error } = await _supabaseClient
            .from('personas')
            .select('*')
            .eq('id', idParam)
            .single();

          if (data) {
            renderizarPersona(data);
            return;
          }
        }
      } catch (e) {
        console.log("Cargando registro local de respaldo para la persona.");
      }

      // Buscar en respaldo local por ID
      const encontrada = personasDemo.find(p => p.id === idParam) || personasDemo[0];
      renderizarPersona(encontrada);
    }

    cargarDatosPersona();
  </script>
</body>
</html>
