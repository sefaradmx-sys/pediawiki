<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentos — Sefarad-mx</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{fontFamily:{serif:['Cormorant Garamond','serif'],sans:['Inter','sans-serif']},colors:{sefarad:{100:'#f4ede0',400:'#c5a16d',600:'#9b6e3c',800:'#67442f'},royal:{950:'#080d1a'}}}}}</script>
  <style>
    .lector{position:relative;user-select:none;min-height:70vh;background:#fff}
    .lector .velo{position:absolute;inset:0;z-index:2}
    .lector canvas,.lector img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
    .activo{outline:2px solid #9b6e3c}
  </style>
</head>
<body class="bg-sefarad-100 text-slate-800 font-sans" oncontextmenu="return false">
  <header class="bg-royal-950 text-sefarad-100 px-6 py-4 flex justify-between items-center">
    <a href="../index.html" class="font-serif text-2xl">Sefarad-mx</a>
    <nav class="text-sm space-x-4 text-sefarad-400">
      <a href="../index.html">Inicio</a>
      <a href="familias.html">Casas</a>
      <a href="documentos.html" class="text-white">Documentos</a>
    </nav>
  </header>
  <main class="max-w-6xl mx-auto px-4 py-8 grid lg:grid-cols-12 gap-6">
    <aside class="lg:col-span-4">
      <p class="text-xs tracking-widest uppercase text-sefarad-600 mb-1">Consulta</p>
      <h1 class="font-serif text-3xl text-sefarad-800 mb-1">Documentos</h1>
      <p class="text-slate-600 text-sm mb-4">Se lee en pantalla. No se descarga.</p>
      <div id="lista" class="space-y-2"></div>
    </aside>
    <section class="lg:col-span-8">
      <h2 id="titulo" class="font-serif text-2xl text-sefarad-800 mb-3">Cargando…</h2>
      <div id="visor" class="lector border border-sefarad-400 p-2"></div>
    </section>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    var RAW = 'https://raw.githubusercontent.com/sefaradmx-sys/genealogia-garcia/main/Imagenes-pdf/';
    var docs = [
      {casa:'Ramos', t:'Joseph García × Francisca Ramos, 1751', f:'Matrimonio Joseph Miguel García y Francisca Xaviera Ramos.PDF'},
      {casa:'Guajardo', t:'José Luis García × Josefa Guaxardo, 1782', f:'08d96abc-4c17-4839-af00-a24afe13fb3c.jpg', img:true},
      {casa:'Peña', t:'Emilio García Peña', f:'EMILIO GARCIA PEÑA.PDF'},
      {casa:'Peña', t:'Emilio García Peña — defunción', f:'EMILIO GARCIA PEÑA DEFUNCION.PDF'},
      {casa:'Peña', t:'María García Peña', f:'MARIA GARCIA PEÑA.PDF'},
      {casa:'Peña', t:'Herminia García Peña', f:'Herminia García PEÑA.PDF'},
      {casa:'Colección', t:'Coahuila — defunciones', f:'Coahuila, México, Registro Civil, Defunciones, 1861-1999 - Ancestry.PDF'},
      {casa:'Colección', t:'Coahuila — matrimonios', f:'Coahuila, México, Registro Civil, Matrimonios, 1861-1950 - Ancestry.PDF'},
      {casa:'Colección', t:'Coahuila — nacimientos', f:'Coahuila, México, Registro Civil, Nacimientos, 1861-1930 - Ancestry.PDF'},
      {casa:'Colección', t:'Coahuila — parroquiales', f:'Coahuila, México, registros parroquiales y diocesanos, 1627-1978 - Ancestry.PDF'}
    ];
    var lista = document.getElementById('lista');
    var botones = [];
    docs.forEach(function (d, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'w-full text-left bg-white border border-sefarad-400 px-3 py-2 hover:bg-sefarad-100';
      b.innerHTML = '<span class="text-[10px] uppercase tracking-widest text-sefarad-600">'+d.casa+'</span><br><span class="font-serif">'+d.t+'</span>';
      b.onclick = function () { ver(d, b); };
      lista.appendChild(b);
      botones.push(b);
    });
    function ver(d, btn) {
      botones.forEach(function (x) { x.classList.remove('activo'); });
      if (btn) btn.classList.add('activo');
      var url = RAW + encodeURIComponent(d.f);
      var host = document.getElementById('visor');
      document.getElementById('titulo').textContent = d.t;
      host.innerHTML = '<p class="text-sm text-slate-500 p-6">Pintando documento…</p>';
      var velo = document.createElement('div');
      velo.className = 'velo';
      if (d.img) {
        var img = document.createElement('img');
        img.alt = '';
        img.onload = function () { host.innerHTML = ''; host.appendChild(img); host.appendChild(velo); };
        img.onerror = function () { host.innerHTML = '<p class="p-6">No se pudo pintar la imagen.</p>'; };
        img.src = url;
        return;
      }
      pdfjsLib.getDocument({url:url}).promise.then(function (pdf) {
        host.innerHTML = '';
        var chain = Promise.resolve();
        for (var n = 1; n <= pdf.numPages; n++) {
          chain = chain.then((function (num) {
            return function () {
              return pdf.getPage(num).then(function (page) {
                var vp = page.getViewport({scale:1.25});
                var c = document.createElement('canvas');
                c.width = vp.width; c.height = vp.height;
                host.appendChild(c);
                return page.render({canvasContext:c.getContext('2d'), viewport:vp}).promise;
              });
            };
          })(n));
        }
        return chain.then(function () { host.appendChild(velo); });
      }).catch(function () {
        host.innerHTML = '<p class="p-6">No se pudo pintar este PDF.</p>';
      });
    }
    document.addEventListener('dragstart', function (e) { e.preventDefault(); });
    ver(docs[0], botones[0]);
  </script>
</body>
</html>
