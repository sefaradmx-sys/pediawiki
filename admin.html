<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administrativo — Memoria Sefardí</title>
  <meta name="description" content="Panel de administración para agregar y gestionar personajes en Memoria Sefardí.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'serif'],
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            sefarad: {
              50: '#fbf8f2',
              100: '#f4ede0',
              200: '#e7d8be',
              300: '#d7bf97',
              400: '#c5a16d',
              500: '#b28549',
              600: '#9b6e3c',
              700: '#7e5433',
              800: '#67442f',
              900: '#54392a',
              950: '#2e1c15',
            },
            royal: {
              800: '#1e293b',
              900: '#0f172a',
              950: '#080d1a',
            }
          }
        }
      }
    }
  </script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(229, 216, 190, 0.5);
    }
  </style>
</head>
<body class="bg-sefarad-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="sticky top-0 z-50 bg-royal-950/90 backdrop-blur-md border-b border-sefarad-500/20 text-white transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        <a href="index.html" class="flex items-center gap-3 group">
          <div class="w-11 h-11 rounded-full bg-gradient-to-br from-sefarad-400 to-sefarad-700 flex items-center justify-center shadow-lg shadow-sefarad-600/30 group-hover:scale-105 transition-transform">
            <span class="font-serif text-2xl font-bold text-white tracking-widest">מ</span>
          </div>
          <div class="flex flex-col">
            <span class="font-serif text-2xl font-bold tracking-wide text-sefarad-100 group-hover:text-sefarad-300 transition-colors">Memoria Sefardí</span>
            <span class="text-xs tracking-widest uppercase text-sefarad-400/90 font-medium">Panel Administrativo</span>
          </div>
        </a>
        <a href="index.html" class="px-4 py-2 bg-sefarad-600 hover:bg-sefarad-700 text-white font-medium rounded-lg transition-colors">
          <i class="fa-solid fa-home mr-2"></i>Volver al Inicio
        </a>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- TÍTULO -->
    <div class="mb-8">
      <h1 class="font-serif text-4xl font-bold text-slate-900 mb-2">Panel Administrativo</h1>
      <p class="text-slate-600">Agrega nuevos personajes a la base de datos de Memoria Sefardí</p>
    </div>

    <!-- FORMULARIO -->
    <div class="glass-card rounded-xl p-8 mb-8">
      <form id="form-personaje">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
          
          <!-- Nombre -->
          <div>
            <label for="nombre" class="block text-sm font-semibold text-slate-700 mb-2">
              <i class="fa-solid fa-user text-sefarad-600 mr-2"></i>Nombre Completo
            </label>
            <input type="text" id="nombre" name="nombre" required class="w-full px-4 py-2 border border-sefarad-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sefarad-600 focus:border-transparent" placeholder="Ej: Samuel Toledano">
          </div>

          <!-- Fecha de Nacimiento -->
          <div>
            <label for="fecha_nacimiento" class="block text-sm font-semibold text-slate-700 mb-2">
              <i class="fa-solid fa-calendar text-sefarad-600 mr-2"></i>Fecha de Nacimiento
            </label>
            <input type="text" id="fecha_nacimiento" name="fecha_nacimiento" class="w-full px-4 py-2 border border-sefarad-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sefarad-600 focus:border-transparent" placeholder="Ej: 1520-05-15">
          </div>

          <!-- Lugar de Origen -->
          <div>
            <label for="lugar_origen" class="block text-sm font-semibold text-slate-700 mb-2">
              <i class="fa-solid fa-map-pin text-sefarad-600 mr-2"></i>Lugar de Origen
            </label>
            <input type="text" id="lugar_origen" name="lugar_origen" class="w-full px-4 py-2 border border-sefarad-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sefarad-600 focus:border-transparent" placeholder="Ej: Toledo, España">
          </div>

          <!-- URL de Imagen -->
          <div>
            <label for="imagen_url" class="block text-sm font-semibold text-slate-700 mb-2">
              <i class="fa-solid fa-image text-sefarad-600 mr-2"></i>URL de la Imagen
            </label>
            <input type="url" id="imagen_url" name="imagen_url" class="w-full px-4 py-2 border border-sefarad-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sefarad-600 focus:border-transparent" placeholder="https://ejemplo.com/imagen.jpg">
          </div>
        </div>

        <!-- Descripción (Full Width) -->
        <div class="mb-6">
          <label for="descripcion" class="block text-sm font-semibold text-slate-700 mb-2">
            <i class="fa-solid fa-pen-to-square text-sefarad-600 mr-2"></i>Descripción
          </label>
          <textarea id="descripcion" name="descripcion" rows="4" class="w-full px-4 py-2 border border-sefarad-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sefarad-600 focus:border-transparent" placeholder="Escribe una descripción detallada del personaje..."></textarea>
        </div>

        <!-- Video YouTube -->
        <div class="mb-6">
          <label for="video_youtube" class="block text-sm font-semibold text-slate-700 mb-2">
            <i class="fa-solid fa-play text-sefarad-600 mr-2"></i>URL del Video (YouTube)
          </label>
          <input type="url" id="video_youtube" name="video_youtube" class="w-full px-4 py-2 border border-sefarad-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sefarad-600 focus:border-transparent" placeholder="https://youtube.com/watch?v=...">
        </div>

        <!-- Botones -->
        <div class="flex gap-4">
          <button type="submit" class="flex-1 bg-sefarad-600 hover:bg-sefarad-700 text-white font-medium py-3 rounded-lg transition-colors flex items-center justify-center gap-2">
            <i class="fa-solid fa-save"></i>Guardar Personaje
          </button>
          <button type="reset" class="flex-1 bg-slate-300 hover:bg-slate-400 text-slate-800 font-medium py-3 rounded-lg transition-colors flex items-center justify-center gap-2">
            <i class="fa-solid fa-redo"></i>Limpiar Formulario
          </button>
        </div>
      </form>
    </div>

    <!-- MENSAJE DE ESTADO -->
    <div id="mensaje-estado" class="hidden mb-8 p-4 rounded-lg flex items-center gap-3">
      <i class="fa-solid fa-check-circle text-2xl"></i>
      <div>
        <p id="texto-estado" class="font-medium"></p>
      </div>
    </div>

    <!-- LISTADO DE PERSONAJES -->
    <div>
      <h2 class="font-serif text-2xl font-bold text-slate-900 mb-6">Personajes Registrados</h2>
      <div id="lista-personajes" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="col-span-3 text-center py-12 text-slate-500">
          <i class="fa-solid fa-spinner fa-spin text-2xl text-sefarad-600 mb-2"></i>
          <p>Cargando personajes...</p>
        </div>
      </div>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="bg-royal-950 text-slate-400 border-t border-sefarad-500/20 py-12 text-center text-sm mt-12">
    <div class="max-w-7xl mx-auto px-4">
      <p class="text-sefarad-300 font-serif text-lg mb-2">Memoria Sefardí</p>
      <p>&copy; 2026 Memoria Sefardí. Todos los derechos reservados.</p>
    </div>
  </footer>

  <!-- LIBRERÍA DE SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <!-- SCRIPTS DE SUPABASE Y ADMIN -->
  <script src="js/supabase.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
